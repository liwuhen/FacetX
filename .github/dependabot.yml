version: 2

# Version-update PRs are paused for both the Yarn workspace and GitHub Actions.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    labels: [dependabot]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 0
    labels: [dependabot]
